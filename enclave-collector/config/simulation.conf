# WSL Simulation Configuration

# Simulation mode settings
simulation_mode=true
hardware_simulation=true
sgx_simulation=true

# WSL specific settings
wsl_mode=true
use_windows_crypto_api=false
disable_hardware_features=true

# Development settings
debug_mode=true
verbose_logging=true
log_level=4

# Mock services
mock_attestation=true
mock_platform_info=true
mock_sealed_storage=true

# Performance adjustments for WSL
reduced_thread_count=true
smaller_memory_pools=true
fast_crypto_mode=true

# File system settings
use_windows_paths=false
case_sensitive_files=false

# Network settings for WSL
bind_to_localhost=true
use_ipv4_only=true
disable_ssl_verification=true
