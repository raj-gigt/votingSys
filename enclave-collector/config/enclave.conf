# Enclave Collector Configuration File

# Network settings
port=8080
max_connections=100
network_timeout=30000

# Logging settings
log_level=2
log_file=logs/collector.log

# Security settings
simulation_mode=true
enable_attestation=false

# Performance settings
thread_pool_size=4
queue_max_size=1000
memory_pool_size=1048576

# Storage settings
data_directory=data
backup_directory=backups
backup_retention_days=30

# Cryptographic settings
key_size=2048
hash_algorithm=SHA256
encryption_algorithm=AES256-GCM

# Vote processing settings
vote_batch_size=100
max_vote_age_ms=86400000
min_vote_age_ms=1000
timestamp_tolerance_ms=5000

# Network endpoints
# attestation_url=https://attestation.service.example.com
# certificate_url=https://certificates.example.com
